*{box-sizing:border-box;margin:0;padding:0}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 22px 80px}

.mast{text-align:center;padding:18px 0 8px}

  width:54px;height:54px;margin:0 auto 14px;border-radius:50%;

.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:26px 0}

.card{

}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--crimson),var(--apricot),var(--ultramarine));

.mode{

}

.opts{margin-top:22px;display:flex;flex-direction:column;gap:2px}

.toggle{width:48px;height:27px;border-radius:20px;background:var(--paper-2);border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}

.toggle.on{background:var(--apricot)}
.toggle.on::after{left:23px}

.btn-primary{background:var(--crimson);color:#fff;box-shadow:0 10px 22px -10px rgba(158,43,37,.8)}

/* ---------- ИСТОРИЯ И РАБОТА НАД ОШИБКАМИ ---------- */
const HKEY='qcitiz_history';
function loadHistory(){try{return JSON.parse(localStorage.getItem(HKEY))||[];}catch(e){return [];}}
function saveAttempt(entry){
  const h=loadHistory(); h.unshift(entry);
  if(h.length>30) h.length=30;
  try{localStorage.setItem(HKEY,JSON.stringify(h));}catch(e){}
}
function clearHistory(){try{localStorage.removeItem(HKEY);}catch(e){}}
function lastMistakes(){
  const h=loadHistory();
  return (h[0] && h[0].wrong) || [];
}
function fmtDate(iso){
  const d=new Date(iso), t=new Date();
  const time=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  const sameDay=d.toDateString()===t.toDateString();
  const y=new Date(t); y.setDate(y.getDate()-1);
  const sameYest=d.toDateString()===y.toDateString();
  if(sameDay) return 'сегодня, '+time;
  if(sameYest) return 'вчера, '+time;
  const months=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate()+' '+months[d.getMonth()]+', '+time;
}
function bankLabel(b){return b==='mistakes' ? 'ошибки' : b;}

  bank:"33",          // '33' | '67' | '135'

  order:[],

const root = document.getElementById('root');

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function renderMistakesCard(){
  const w=lastMistakes();
  if(!w.length) return '';
  return `<div class="card mini">
    <div class="mini-title"><span class="ic">🎯</span>Работа над ошибками</div>

      <button class="btn-mini" data-mi="study">📖 Учить</button>
    </div>
  </div>`;
}

function renderHistoryCard(){
  const h=loadHistory();
  if(!h.length) return '';
  const rows=h.slice(0,8).map(e=>{
    const ok=e.passed;
    return `<div class="hrow">
      <div class="hdate">${fmtDate(e.ts)}</div>
      <div class="hbank">${bankLabel(e.bank)}</div>
      <div class="hscore">${e.score}<span class="hsub">/${e.total}</span></div>
      <div class="hbadge ${ok?'ok':'fail'}">${ok?'✓':'✕'}</div>
    </div>`;
  }).join('');
  return `<div class="card mini">
    <div class="mini-title-row">
      <div class="mini-title"><span class="ic">📜</span>История</div>
      <button class="hclear" id="hclear">очистить</button>
    </div>
    <div class="hlist">${rows}</div>
  </div>`;
}

function startMistakes(mode){
  const w=lastMistakes();
  if(!w.length) return;
  S.isMistakes=true;
  S.order=w.slice();
  startSession(mode);
}

function startSession(mode){
  S.mode=mode;
  S.idx=0;S.score=0;S.answered=false;S.picked=null;S.wrong=[];
  if(!S.isMistakes){
    const base = bankOrder().slice();
    S.order = (mode==='quiz' && S.shuffleQ) ? shuffle(base) : base;
  }
  if(mode==='study') renderStudy(); else renderQuiz();
}

function answersHtml(q,{study=false}={}){
  return `<div class="answers ${study?'study-answers':''}">` + q.a.map((ans,i)=>{
    let cls='ans';
    if(study){ if(ans.c) cls+=' correct locked'; else cls+=' locked'; }
    return `<button class="${cls}" data-i="${i}">
      <span class="letter">${LETTERS[i]}</span>
      <span class="atext">
        <span class="ahy">${ans.hy}</span>
        ${S.showTr?`<span class="atr">${ans.tr}</span>`:''}
        ${S.showRu?`<span class="aru">${ans.ru}</span>`:''}
      </span>
      ${study&&ans.c?'<span class="mark">✓</span>':''}
    </button>`;
  }).join('') + `</div>`;
}

function questionBlock(q){
  return `<div class="q-hy">${q.hy}</div>
    ${S.showTr?`<div class="q-tr">${q.tr}</div>`:''}
    ${S.showRu?`<div class="q-ru">${q.ru}</div>`:''}`;
}

      <div class="btn-row" id="row">
        <button class="btn btn-ghost" id="quit">Выйти</button>
      </div>
    </div>
    ${footer()}
  </div>`;

  root.querySelector('#quit').onclick=renderStart;

  root.querySelectorAll('.ans').forEach(b=>{
    b.onclick=()=>{
      if(S.answered)return;
      S.answered=true;
      const i=+b.dataset.i;
      const correctI=q.a.findIndex(x=>x.c);
      const isOk=q.a[i].c;
      if(isOk)S.score++; else S.wrong.push({qi,picked:i});
      root.querySelectorAll('.ans').forEach((el,j)=>{
        el.classList.add('locked');
        if(j===correctI){el.classList.add('correct');el.insertAdjacentHTML('beforeend','<span class="mark">✓</span>');}
        if(j===i&&!isOk){el.classList.add('wrong');el.insertAdjacentHTML('beforeend','<span class="mark">✕</span>');}
      });
      const fb=root.querySelector('#fb');
      fb.className='feedback show '+(isOk?'ok':'no');
      fb.innerHTML=isOk?'✓ Верно!':`✕ Неверно. Правильный ответ — <b style="margin-left:4px">${LETTERS[correctI]}</b>`;
      const next=document.createElement('button');
      next.className='btn btn-primary';
      next.textContent = S.idx+1<S.order.length ? 'Следующий вопрос →' : 'Показать результат →';
      next.onclick=()=>{
        if(S.idx+1<S.order.length){S.idx++;S.answered=false;S.picked=null;renderQuiz();}
        else renderResult();
      };
      root.querySelector('#row').prepend(next);
    };
  });
}

/* ---------- STUDY ---------- */
function renderStudy(){
  const cards=S.order.map((qi,n)=>{
    const q=DATA135[qi];
    return `<div class="card fade" style="margin-bottom:16px">
      <div class="qtop"><span class="badge">№ ${n+1}</span></div>
      ${questionBlock(q)}
      ${answersHtml(q,{study:true})}
    </div>`;
  }).join('');
  root.innerHTML=`<div class="wrap">
    <header class="mast" style="padding-bottom:0">
      <div class="kicker">Режим заучивания</div>
      <h1 style="font-size:32px">Все 33 вопроса</h1>
    </header>
    <div class="btn-row" style="margin:18px 0 22px">
      <button class="btn btn-ghost" id="back">← Меню</button>
      <button class="btn btn-primary" id="toquiz">Перейти к тесту →</button>
    </div>
    ${cards}
    <div class="btn-row"><button class="btn btn-ghost" id="back2">← В меню</button></div>
    ${footer()}
  </div>`;
  root.querySelector('#back').onclick=renderStart;
  root.querySelector('#back2').onclick=renderStart;
  root.querySelector('#toquiz').onclick=()=>startSession('quiz');
  window.scrollTo(0,0);
}

/* ---------- RESULT ---------- */
function renderResult(){
  const passed=S.score>=bankPass();
  // сохраняем попытку в локальную историю
  const wrongIdxs = S.wrong.map(w=>S.order[w.qi]);
  saveAttempt({
    ts: new Date().toISOString(),
    bank: S.isMistakes ? 'mistakes' : S.bank,
    score: S.score,
    total: S.order.length,
    passed: passed,
    wrong: wrongIdxs
  });
  const pct=S.score/S.order.length;
  const circ=2*Math.PI*66;
  const dash=circ*pct;
  const col=passed?'var(--correct)':'var(--crimson)';

  const review = S.wrong.map(w=>{
    const q=DATA135[w.qi];
    const correctI=q.a.findIndex(x=>x.c);
    return `<div class="rev">
      <div class="rq">${q.hy}${S.showRu?` <span style="font-weight:400;color:var(--ink-soft);font-size:13px">— ${q.ru}</span>`:''}</div>
      <div class="rline you">✕ Ваш ответ: ${q.a[w.picked].hy}</div>
      <div class="rline ok">✓ Верно: ${q.a[correctI].hy}</div>
      ${S.showTr?`<div class="rtr">${q.a[correctI].tr}</div>`:''}
    </div>`;
  }).join('');

  root.innerHTML=`<div class="wrap fade">
    ${mast()}
    <div class="rule"></div>
    <div class="card">
      <div class="ring">
        <svg width="150" height="150">
          <circle cx="75" cy="75" r="66" fill="none" stroke="var(--paper-2)" stroke-width="12"/>
          <circle cx="75" cy="75" r="66" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${dash} ${circ}"/>
        </svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center">
          <div class="result-num">${S.score}<span>/${S.order.length}</span></div>
        </div>
      </div>
      <div class="verdict ${passed?'pass':'fail'}">${passed?'Тест пройден! 🎉':'Пока не хватает'}</div>
      <div class="verdict-sub">${passed
        ? `Вы набрали проходной балл (нужно ${bankPass()}+).`
        : `Нужно минимум ${bankPass()} правильных. Не хватает ${bankPass()-S.score}. Ещё немного практики!`}</div>

      <div class="btn-row">
        <button class="btn btn-ghost" id="menu">В меню</button>
        <button class="btn btn-primary" id="again">Пройти заново</button>
      </div>

      ${S.wrong.length?`<div class="review-h">📝 Разбор ошибок (${S.wrong.length})</div>${review}`:`<div class="review-h" style="color:var(--correct)">✓ Без единой ошибки — превосходно!</div>`}
    </div>
    ${footer()}
  </div>`;
  root.querySelector('#menu').onclick=renderStart;
  root.querySelector('#again').onclick=()=>startSession('quiz');
  window.scrollTo(0,0);
}

renderStart();
</script>
